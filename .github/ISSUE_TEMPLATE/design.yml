name: Design proposal
description: Review a material public contract before implementation.
title: "design: "
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: State the decision needed and the user problem.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract and failure semantics
      description: Specify inputs, outputs, validation, errors, and ownership.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and rollback
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
