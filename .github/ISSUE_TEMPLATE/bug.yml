name: Bug report
description: Report incorrect behavior with a safe reproduction.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description: What broke, and who is affected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic requests. Remove prompts, tokens, and customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Package, Python, platform, and integration versions
      placeholder: "cachelint 0.1.0a1, Python 3.11, Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or traceback
      description: Omit secrets, raw prompts, and private paths.
