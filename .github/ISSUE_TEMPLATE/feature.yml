name: Feature proposal
description: Propose a user-visible improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Who needs this, and why now?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include CLI or API examples when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Relevant alternatives
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Cover existing input, output, and Python support.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
