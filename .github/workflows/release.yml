name: Publish PyPI prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version
        required: true
        type: string
      candidate_sha:
        description: Full reviewed main commit SHA
        required: true
        type: string
      confirmation:
        description: Type publish VERSION exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cachelint-pypi-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  preflight:
    name: Check release gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Check dispatch before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Diafyx/cachelint"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$VERSION" = "0.2.0a3"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "publish $VERSION"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify GitHub, PyPI, and source state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_gate.py preflight

  build:
    name: Build reviewed artifacts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheel and sdist once
        run: |
          python -m pip install build twine
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
          python tools/inspect_artifacts.py dist
      - name: Smoke install wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cachelint-release-smoke"
          "$RUNNER_TEMP/cachelint-release-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          python -m venv "$RUNNER_TEMP/cachelint-release-sdk-smoke"
          wheel=$(echo dist/*.whl)
          "$RUNNER_TEMP/cachelint-release-sdk-smoke/bin/python" -m pip install "${wheel}[sdk-anthropic,sdk-openai]" pytest
          cp tests/test_recording_sdk.py "$RUNNER_TEMP/test_recording_sdk.py"
          cp tools/smoke_observed_release.py "$RUNNER_TEMP/smoke_observed_release.py"
          cp tools/smoke_regression_release.py "$RUNNER_TEMP/smoke_regression_release.py"
          cp -r examples/regression-ci "$RUNNER_TEMP/regression-fixture"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cachelint-release-smoke/bin/python" -c "from importlib.metadata import version; import cachelint; assert cachelint.__version__ == version('cachelint')"
          "$RUNNER_TEMP/cachelint-release-smoke/bin/cachelint" --version
          printf '%s\n' '{"model":"demo","system":"Alpha","messages":[]}' '{"model":"demo","system":"Beta","messages":[]}' > requests.jsonl
          "$RUNNER_TEMP/cachelint-release-smoke/bin/cachelint" analyze requests.jsonl
          "$RUNNER_TEMP/cachelint-release-smoke/bin/cachelint" corpus requests.jsonl --format json --output corpus-report.json
          "$RUNNER_TEMP/cachelint-release-smoke/bin/python" smoke_observed_release.py
          "$RUNNER_TEMP/cachelint-release-smoke/bin/python" smoke_regression_release.py regression-fixture
          "$RUNNER_TEMP/cachelint-release-smoke/bin/python" -c "import json; from pathlib import Path; from importlib.resources import files; report=json.loads(Path('corpus-report.json').read_text()); assert report['schema_version']==1 and report['patterns'][0]['path']=='system'; schema=json.loads(files('cachelint').joinpath('corpus_report_v1.schema.json').read_text()); assert schema['properties']['schema_version']=={'const':1}"
          printf '%s\n' '{"model":"claude-sonnet-4-6","system":"shared A","messages":[]}' '{"model":"claude-sonnet-4-6","system":"shared B","messages":[]}' > known.jsonl
          "$RUNNER_TEMP/cachelint-release-smoke/bin/cachelint" analyze known.jsonl | grep -F 'Documented model minimum: 1024 tokens'
          "$RUNNER_TEMP/cachelint-release-sdk-smoke/bin/python" -m pytest -q test_recording_sdk.py
      - name: Record exact artifact hashes
        run: |
          python tools/release_artifacts.py package dist release-artifact
          cat release-artifact/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cachelint-0.2.0a3
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Approve and publish exact artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/cachelint
    permissions:
      actions: read
      contents: read
      issues: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cachelint-0.2.0a3
          path: release-artifact
      - name: Verify approval and artifact bytes
        shell: bash
        env:
          RELEASE_APPROVED_VERSION: ${{ vars.RELEASE_APPROVED_VERSION }}
        run: |
          set -euo pipefail
          test "$RELEASE_APPROVED_VERSION" = "0.2.0a3"
          test "$VERSION" = "0.2.0a3"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(find release-artifact -type f | wc -l)" -eq 3
          test "$(find release-artifact/dist -maxdepth 1 -type f | wc -l)" -eq 2
          test -f release-artifact/dist/cachelint-0.2.0a3-py3-none-any.whl
          test -f release-artifact/dist/cachelint-0.2.0a3.tar.gz
          test -f release-artifact/SHA256SUMS
          cd release-artifact
          test "$(wc -l < SHA256SUMS)" -eq 2
          test "$(awk '{print $2}' SHA256SUMS | sort)" = "$(printf '%s\n' 'dist/cachelint-0.2.0a3-py3-none-any.whl' 'dist/cachelint-0.2.0a3.tar.gz' | sort)"
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
      - name: Recheck remote state after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          main_sha=$(gh api repos/Diafyx/cachelint/git/ref/heads/main --jq '.object.sha')
          test "$main_sha" = "$CANDIDATE_SHA"
          tag_object=$(gh api "repos/Diafyx/cachelint/git/ref/tags/v$VERSION" --jq '.object')
          tag_type=$(jq -r '.type' <<< "$tag_object")
          tag_sha=$(jq -r '.sha' <<< "$tag_object")
          for _ in 1 2 3 4; do
            if [[ "$tag_type" = commit ]]; then break; fi
            test "$tag_type" = tag
            tag_object=$(gh api "repos/Diafyx/cachelint/git/tags/$tag_sha" --jq '.object')
            tag_type=$(jq -r '.type' <<< "$tag_object")
            tag_sha=$(jq -r '.sha' <<< "$tag_object")
          done
          test "$tag_type" = commit
          test "$tag_sha" = "$CANDIDATE_SHA"
          test "$(gh api repos/Diafyx/cachelint/milestones/6 --jq '.state + " " + .title')" = "open 0.2.0a3"
          test "$(gh api repos/Diafyx/cachelint/issues/47 --jq '.state + " " + .title + " " + (.milestone.number | tostring)')" = "open release: 0.2.0a3 6"
          test "$(gh api repos/Diafyx/cachelint/issues/46 --jq '.state + " " + .title + " " + (.milestone.number | tostring)')" = "closed maintenance: prepare 0.2.0a3 release candidate 6"
          test "$(gh api 'repos/Diafyx/cachelint/issues?milestone=6&state=open&per_page=100' --jq 'length == 1 and .[0].number == 47')" = true
          environment=$(gh api repos/Diafyx/cachelint/environments/pypi)
          test "$(jq -r '.name' <<< "$environment")" = pypi
          test "$(jq -r '.deployment_branch_policy.custom_branch_policies' <<< "$environment")" = true
          test "$(jq -r '[.protection_rules[] | select(.type == "required_reviewers")] | length' <<< "$environment")" -eq 1
          test "$(jq -r '[.protection_rules[] | select(.type == "required_reviewers")][0].prevent_self_review' <<< "$environment")" = false
          test "$(jq -r '[.protection_rules[] | select(.type == "required_reviewers")][0].reviewers | length' <<< "$environment")" -eq 1
          test "$(jq -r '[.protection_rules[] | select(.type == "required_reviewers")][0].reviewers[0].reviewer.login' <<< "$environment")" = SEPURI-SAI-KRISHNA
          policies=$(gh api 'repos/Diafyx/cachelint/environments/pypi/deployment-branch-policies?per_page=100')
          test "$(jq -r '.total_count' <<< "$policies")" -eq 1
          test "$(jq -r '.branch_policies[0].name' <<< "$policies")" = main
          test "$(jq -r '.branch_policies[0].type // "branch"' <<< "$policies")" = branch
          curl --fail --silent --show-error --max-time 20 \
            --output "$RUNNER_TEMP/cachelint-pypi-project.json" \
            https://pypi.org/pypi/cachelint/json
          pypi="$RUNNER_TEMP/cachelint-pypi-project.json"
          test "$(jq -r '.info.name' "$pypi")" = cachelint
          test "$(jq -r '.info.version' "$pypi")" = 0.2.0a2
          test "$(jq -r '.info.project_urls.Source' "$pypi")" = https://github.com/Diafyx/cachelint
          test "$(jq -r '[.ownership.roles[] | select(.role == "Owner") | .user] | sort | join(",")' "$pypi")" = saikrishnapypi
          test "$(jq -r '.releases["0.2.0a2"] | length' "$pypi")" -eq 2
          test "$(jq -r '.releases["0.2.0a2"] | map(.filename) | sort | join(",")' "$pypi")" = cachelint-0.2.0a2-py3-none-any.whl,cachelint-0.2.0a2.tar.gz
          test "$(jq -r --arg version "$VERSION" '.releases | has($version)' "$pypi")" = false
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-artifact/dist/
          attestations: true

  github_release:
    name: Verify PyPI and create GitHub prerelease
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cachelint-0.2.0a3
          path: release-artifact
      - name: Verify published and retained bytes
        run: python tools/release_artifacts.py pypi release-artifact
      - name: Create reviewed GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_url=$(gh release create "v$VERSION" \
            release-artifact/dist/cachelint-0.2.0a3-py3-none-any.whl \
            release-artifact/dist/cachelint-0.2.0a3.tar.gz \
            --repo Diafyx/cachelint --verify-tag --prerelease \
            --title "cachelint $VERSION" \
            --notes-file docs/releases/0.2.0a3.md)
          {
            echo "## cachelint $VERSION prerelease"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $CANDIDATE_SHA"
            echo "Tag: v$VERSION"
            echo "PyPI: https://pypi.org/project/cachelint/$VERSION/"
            echo "GitHub release: $release_url"
            echo 'SHA-256 manifest:'
            echo '~~~text'
            cat release-artifact/SHA256SUMS
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
