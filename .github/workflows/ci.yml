name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e '.[sdk-anthropic,sdk-openai]'
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests tools
      - name: Unit tests and branch coverage
        run: pytest --cov=cachelint --cov-branch --cov-report=term-missing --cov-fail-under=100

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -e '.[sdk-anthropic,sdk-openai]'
      - name: Test
        run: pytest

  package:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Check metadata and artifact contents
        run: |
          python -m twine check dist/*
          python tools/inspect_artifacts.py dist
      - name: Install and smoke test wheel and sdist outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/cachelint-smoke"
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          python -m venv "$RUNNER_TEMP/cachelint-sdist-smoke"
          "$RUNNER_TEMP/cachelint-sdist-smoke/bin/python" -m pip install --no-deps dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/cachelint-sdk-smoke"
          WHEEL=$(echo dist/*.whl)
          "$RUNNER_TEMP/cachelint-sdk-smoke/bin/python" -m pip install "${WHEEL}[sdk-anthropic,sdk-openai]" pytest
          cp tests/test_recording_sdk.py "$RUNNER_TEMP/test_recording_sdk.py"
          cp tools/smoke_observed_release.py "$RUNNER_TEMP/smoke_observed_release.py"
          cp tools/smoke_regression_release.py "$RUNNER_TEMP/smoke_regression_release.py"
          cp -r examples/regression-ci "$RUNNER_TEMP/regression-fixture"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -c "from importlib.metadata import version; import cachelint; assert cachelint.__version__ == version('cachelint')"
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" --help
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" --version
          "$RUNNER_TEMP/cachelint-sdk-smoke/bin/python" -c "import anthropic, openai; from cachelint.recording import RequestRecorder, AsyncRequestRecorder; assert anthropic.__version__ == '1.8.0'; assert openai.__version__ == '3.37.0'"
          printf '%s\n' '{"model":"demo","system":"Alpha","messages":[]}' '{"model":"demo","system":"Beta","messages":[]}' > requests.jsonl
          printf '%s\n' '{"model":"demo","system":"Alpha","messages":[]}' > first.json
          printf '%s\n' '{"model":"demo","system":"Beta","messages":[]}' > second.json
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" analyze requests.jsonl
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" diff first.json second.json
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" corpus requests.jsonl --format json --output corpus-wheel.json
          "$RUNNER_TEMP/cachelint-sdist-smoke/bin/cachelint" corpus requests.jsonl --format json --output corpus-sdist.json
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" baseline create corpus-wheel.json --output baseline-wheel.json
          "$RUNNER_TEMP/cachelint-sdist-smoke/bin/cachelint" baseline create corpus-sdist.json --output baseline-sdist.json
          cmp baseline-wheel.json baseline-sdist.json
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" baseline inspect baseline-wheel.json --format json > baseline-inspected.json
          cmp baseline-wheel.json baseline-inspected.json
          printf '%s\n' '{"schema_version":1,"policy_type":"cachelint.regression-policy","cohort_matching":"index_and_provider","on_missing_cohort":"error","on_new_cohort":"error","on_incomparable_cohort":"error","on_missing_metric":"error","rules":[{"metric":"diverged_count","direction":"increase","tolerance":0,"severity":"error","cohort":null}]}' > policy.json
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" baseline check baseline-wheel.json corpus-wheel.json --policy policy.json --format json --output regression-wheel.json
          "$RUNNER_TEMP/cachelint-sdist-smoke/bin/cachelint" baseline check baseline-sdist.json corpus-sdist.json --policy policy.json --format json --output regression-sdist.json
          cmp regression-wheel.json regression-sdist.json
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -c "import json; from pathlib import Path; from importlib.resources import files; result=json.loads(Path('regression-wheel.json').read_text()); assert result['status']=='pass' and result['summary']['measurement_count']==1; assert json.loads(files('cachelint').joinpath('regression_policy_v1.schema.json').read_text())['properties']['schema_version']=={'const':1}"
          "$RUNNER_TEMP/cachelint-smoke/bin/python" smoke_observed_release.py
          "$RUNNER_TEMP/cachelint-sdist-smoke/bin/python" smoke_observed_release.py
          "$RUNNER_TEMP/cachelint-smoke/bin/python" smoke_regression_release.py regression-fixture
          "$RUNNER_TEMP/cachelint-sdist-smoke/bin/python" smoke_regression_release.py regression-fixture
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -c "import json; from pathlib import Path; from importlib.resources import files; a=json.loads(Path('corpus-wheel.json').read_text()); b=json.loads(Path('corpus-sdist.json').read_text()); assert a==b and a['schema_version']==1 and a['patterns'][0]['path']=='system'; assert json.loads(files('cachelint').joinpath('corpus_report_v1.schema.json').read_text())['properties']['schema_version']=={'const':1}"
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -c "import json; from importlib.resources import files; assert json.loads(files('cachelint').joinpath('baseline_v1.schema.json').read_text())['properties']['schema_version']=={'const':1}"
          "$RUNNER_TEMP/cachelint-sdk-smoke/bin/python" -m pytest -q test_recording_sdk.py
