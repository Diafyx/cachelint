name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests tools
      - name: Unit tests and branch coverage
        run: pytest --cov=cachelint --cov-branch --cov-report=term-missing --cov-fail-under=100

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -e .
      - name: Test
        run: pytest

  package:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Check metadata and artifact contents
        run: |
          python -m twine check dist/*
          python tools/inspect_artifacts.py dist
      - name: Install wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/cachelint-smoke"
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cachelint-smoke/bin/python" -c "from importlib.metadata import version; import cachelint; assert cachelint.__version__ == version('cachelint')"
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" --help
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" --version
          printf '%s\n' '{"model":"demo","system":"Alpha","messages":[]}' '{"model":"demo","system":"Beta","messages":[]}' > requests.jsonl
          printf '%s\n' '{"model":"demo","system":"Alpha","messages":[]}' > first.json
          printf '%s\n' '{"model":"demo","system":"Beta","messages":[]}' > second.json
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" analyze requests.jsonl
          "$RUNNER_TEMP/cachelint-smoke/bin/cachelint" diff first.json second.json
